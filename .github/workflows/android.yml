name: Android

# Builds a test APK and publishes it at a fixed download link a phone can
# open directly:
# https://github.com/di258294-lang/-1-/releases/download/android-test/hold.apk

on:
  push:
    branches: [claude/charming-mccarthy-nehx3c, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build test APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk hold.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hold-apk
          path: hold.apk
          retention-days: 30
      - name: Publish to the android-test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-test --yes --cleanup-tag || true
          gh release create android-test hold.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "안드로이드 테스트 버전" \
            --notes "폰에서 hold.apk를 눌러 설치하세요. 테스트용 빌드이고, 스토어 버전이 아니에요. (${GITHUB_SHA::7})"
