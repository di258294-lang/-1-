name: Android

# Builds a debug APK you can install directly on an Android phone for
# testing. Download it from the run's "Artifacts" section.

on:
  push:
    branches: [claude/charming-mccarthy-nehx3c, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: hold-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
