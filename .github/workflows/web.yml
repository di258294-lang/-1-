name: Web

# Tests, builds and publishes the web version (plus privacy/support pages)
# to GitHub Pages. One-time setup: Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [claude/charming-mccarthy-nehx3c, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub recommends letting an in-progress Pages deployment finish; a newer
# run queues behind it instead of cancelling it half-deployed.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run font:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
